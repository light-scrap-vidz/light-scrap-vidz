# `cargo test` regenerates the TypeScript types of the IPC payloads (ts-rs) into
# src/types/generated; CI fails when the committed copies are stale. The file lives at the
# repository root so it is found whether cargo runs from the root (--manifest-path) or from
# src-tauri.
[env]
TS_RS_EXPORT_DIR = { value = "src/types/generated", relative = true }
