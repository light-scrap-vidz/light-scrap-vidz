name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint-and-test-frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npx vite build

      - name: Test
        run: npm test

  e2e-ui:
    name: E2E (UI, real browser)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  lint-and-test-rust:
    name: Rust (clippy + test)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Bundle yt-dlp binary (required by Tauri build script)
        run: |
          mkdir -p src-tauri/binaries
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o "src-tauri/binaries/yt-dlp-lsv-x86_64-unknown-linux-gnu"
          chmod +x "src-tauri/binaries/yt-dlp-lsv-x86_64-unknown-linux-gnu"

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: TypeScript types generated from the Rust structs are up to date
        run: |
          git diff --exit-code -- src/types/generated
          test -z "$(git ls-files --others --exclude-standard src/types/generated)"

  rust-macos:
    name: Rust (test, macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Bundle yt-dlp binary (required by Tauri build script)
        run: |
          mkdir -p src-tauri/binaries
          curl -fL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o "src-tauri/binaries/yt-dlp-lsv-aarch64-apple-darwin"
          chmod +x "src-tauri/binaries/yt-dlp-lsv-aarch64-apple-darwin"

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
