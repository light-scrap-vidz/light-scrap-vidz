# cargo-audit configuration (read from the manifest directory).
#
# An advisory is only ignored when it cannot reach a build that is shipped.
[advisories]
ignore = [
  # zip 4.6.1 is pulled in by tauri-plugin-updater for its Windows installer only: `cargo
  # tree -i zip --target x86_64-unknown-linux-gnu` (and aarch64-apple-darwin) finds nothing.
  # The app is released for macOS and Linux.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]
