name: E2E (desktop)

# The real app in a real window: packaged frontend, Rust backend, WebKitGTK, driven through
# tauri-driver. yt-dlp is replaced by a fake (YTDLP_PATH), so it needs no network.
on:
  push:
    branches: [main, e2e-wip]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'e2e/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-desktop.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'e2e/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/e2e-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop e2e (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Cache tauri-driver
        id: driver
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-v2

      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix e2e/desktop

      - name: Placeholder sidecar (the build script requires one; the tests use the fake)
        run: |
          mkdir -p src-tauri/binaries
          printf '#!/bin/sh\nexit 0\n' > src-tauri/binaries/yt-dlp-lsv-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/yt-dlp-lsv-x86_64-unknown-linux-gnu

      - name: Build the app (debug, no bundle)
        run: npm run tauri -- build --debug --no-bundle

      - name: Run the e2e tests
        run: xvfb-run -a npm test --prefix e2e/desktop
